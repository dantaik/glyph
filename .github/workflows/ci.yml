name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      # Both passes: the offline pass asserts the single file is self-contained
      # and under its size ceiling (see vite.config.js).
      - run: npm run build
