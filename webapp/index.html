<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Theme, article size and interface language, before the first paint:
      // the stored language decides <html lang> and the tab title, so a
      // reader who chose 中文 never sees a flash of the English default.
      (function () {
        try {
          var t = localStorage.getItem('glyph.theme.v1');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var d = document.documentElement;
          d.classList.toggle('dark', dark);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#16181c' : '#f7f8fa');
          var f = localStorage.getItem('glyph.fontsize.v1');
          if (f === 's' || f === 'l') d.dataset.fontsize = f;
          if (localStorage.getItem('glyph.lang.v1') === 'zh') {
            d.lang = 'zh-CN';
            document.title = '\u96EA\u6CE5';
          }
        } catch (e) {}
      })();
    </script>
    <title>Glyph</title>
    <meta
      name="description"
      content="Glyph — a writing system that lives entirely on Ethereum. No off-chain dependencies; it outlives its authors."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2.75' y='2.75' width='18.5' height='18.5' rx='5' fill='%232f5fe0'/><g stroke='%23ffffff' stroke-width='2' stroke-linecap='round' fill='none'><path d='M12.3 13.9V7.9'/><path d='M12.3 13.9L7.9 10.9'/><path d='M12.3 13.9L16.7 10.9'/><path d='M12.3 13.9L13.8 18'/></g></svg>" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
